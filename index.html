<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC ESNA 2 - Finance Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
            --input-bg: rgba(30, 41, 59, 0.7);
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --glow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1e293b;
            --input-bg: #f1f5f9;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #e2e8f0;
            --glow: 0 0 10px rgba(14, 165, 233, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 25px;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow);
            margin-bottom: 20px;
        }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .controls-left { display: flex; gap: 8px; }

        .btn-tool {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; }
        .btn-reset:hover { background: #ef4444; color: white; }

        .logo-area { text-align: center; margin-bottom: 1.5rem; }
        .logo-main {
            font-size: 2rem; font-weight: 800; color: var(--primary-neon);
            animation: neon-pulse 2s infinite alternate; letter-spacing: 2px;
        }

        @keyframes neon-pulse {
            from { text-shadow: 0 0 5px var(--primary-neon); transform: scale(1); }
            to { text-shadow: 0 0 15px var(--primary-neon); transform: scale(1.02); }
        }

        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; opacity: 0.8; font-weight: 600; }
        input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--input-bg); color: var(--text-color); outline: none; font-size: 1rem;
        }

        .results {
            margin-top: 1.5rem; padding: 15px; background: rgba(0, 0, 0, 0.15); border-radius: 15px; border: 1px solid var(--border-color);
        }

        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .result-item span:last-child { color: var(--primary-neon); font-weight: bold; }

        .save-btn, .share-btn {
            width: 100%; background: transparent; color: var(--primary-neon); border: 1px solid var(--primary-neon);
            padding: 12px; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 0.8rem;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Cairo';
        }
        .share-btn { color: var(--secondary-neon); border-color: var(--secondary-neon); }
        .save-btn:hover { background: var(--primary-neon); color: #000; box-shadow: 0 0 15px var(--primary-neon); }
        .share-btn:hover { background: var(--secondary-neon); color: white; box-shadow: 0 0 15px var(--secondary-neon); }

        /* توقيع أسامة */
        .dev-signature {
            margin-top: 20px; font-family: 'Poppins', sans-serif; font-size: 0.8rem;
            letter-spacing: 1px; opacity: 0.9; color: var(--text-color);
        }
        .dev-signature span { color: var(--primary-neon); font-weight: 700; text-shadow: 0 0 8px var(--primary-neon); }

        /* فوتر السوشيال ميديا في الأسفل */
        .footer-container {
            margin-top: auto; padding: 30px 0; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .social-row { display: flex; gap: 20px; justify-content: center; }
        .social-icon { 
            width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; color: white; text-decoration: none; font-size: 1.4rem; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.4s;
        }
        .social-icon:hover { transform: translateY(-5px); border-color: var(--primary-neon); }
        .icon-fb { background: #1877F2; } .icon-wa { background: #25d366; } .icon-ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    </style>
</head>
<body>

<div class="container" id="calculatorCard">
    <div class="header-actions">
        <div class="controls-left">
            <button class="btn-tool" onclick="toggleLang()" id="langBtn"><i class="fas fa-language"></i> EN</button>
            <button class="btn-tool" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
        <button class="btn-tool btn-reset" id="resetBtn" onclick="resetAll()"><i class="fas fa-trash-alt"></i> مسح</button>
    </div>

    <div class="logo-area">
        <div class="logo-main">FC ESNA 2</div>
        <p style="font-size: 0.8rem; opacity: 0.6; margin: 0;">Finance Calculator</p>
    </div>

    <div class="input-group">
        <label id="lblAmount">المبلغ الأساسي</label>
        <input type="number" id="amount" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group">
            <label id="lblAdminRate">المصاريف (%)</label>
            <input type="number" id="adminRate" value="5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="lblInterest">الفايدة (%)</label>
            <input type="number" id="interest" placeholder="0" oninput="calculate()">
        </div>
    </div>

    <div class="input-group">
        <label id="lblMonths">المدة (بالشهور)</label>
        <input type="number" id="months" placeholder="0" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-item"><span id="resAdmin">المصاريف الإدارية:</span> <span id="adminFee">0</span></div>
        <div class="result-item"><span id="resMonthly">القسط الشهري:</span> <span id="monthlyPayment" style="color: var(--secondary-neon);">0</span></div>
        <div class="result-item" style="border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px;">
            <span id="resFinal" style="font-weight: 800;">صافي المستلم:</span> <span id="netAmount">0</span>
        </div>
    </div>

    <button class="save-btn" onclick="downloadImage()">
        <i class="fas fa-file-download"></i> <span id="saveTxt">حفظ كصورة</span>
    </button>
    
    <button class="share-btn" onclick="shareApp()">
        <i class="fas fa-share-nodes"></i> <span id="shareTxt">مشاركة الموقع</span>
    </button>
</div>

<div class="footer-container">
    <div class="social-row">
        <a href="https://wa.me/message/FJEGUNCJ4JX7P1" class="social-icon icon-wa" target="_blank"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.instagram.com/osamamasrawy?igsh=MWJqcnhhMWd6MjNxNQ%3D%3D" class="social-icon icon-ig" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.facebook.com/share/18TtS2GVNi/" class="social-icon icon-fb" target="_blank"><i class="fab fa-facebook-f"></i></a>
    </div>

    <div class="dev-signature">
        Developed by <span>Osama</span>
    </div>
</div>

<script>
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeBtn').innerText = next === 'light' ? '☀️' : '🌙';
    }

    function toggleLang() {
        const html = document.documentElement;
        const isAr = html.getAttribute('lang') === 'ar';
        if (isAr) {
            html.setAttribute('lang', 'en'); html.setAttribute('dir', 'ltr');
            document.getElementById('langBtn').innerHTML = '<i class="fas fa-language"></i> AR';
            updateTexts('en');
        } else {
            html.setAttribute('lang', 'ar'); html.setAttribute('dir', 'rtl');
            document.getElementById('langBtn').innerHTML = '<i class="fas fa-language"></i> EN';
            updateTexts('ar');
        }
    }

    function updateTexts(lang) {
        const texts = {
            ar: { save: "حفظ كصورة", share: "مشاركة الموقع", amount: "المبلغ الأساسي", resFinal: "صافي المستلم:" },
            en: { save: "Save as Image", share: "Share Website", amount: "Principal Amount", resFinal: "Final Net:" }
        };
        const t = texts[lang];
        document.getElementById('saveTxt').innerText = t.save;
        document.getElementById('shareTxt').innerText = t.share;
        document.getElementById('lblAmount').innerText = t.amount;
        document.getElementById('resFinal').innerText = t.resFinal;
        calculate();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const adminRate = parseFloat(document.getElementById('adminRate').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const adminFee = amount * (adminRate / 100);
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        const rawMonthly = months > 0 ? (amount + totalInterest) / months : 0;
        const roundedMonthly = Math.ceil(rawMonthly / 5) * 5;
        const netFinal = amount > 0 ? (amount - adminFee - roundedMonthly) : 0;

        document.getElementById('adminFee').innerText = adminFee.toLocaleString();
        document.getElementById('monthlyPayment').innerText = roundedMonthly.toLocaleString();
        document.getElementById('netAmount').innerText = Math.max(0, Math.floor(netFinal)).toLocaleString();
    }

    function resetAll() {
        document.getElementById('amount').value = '';
        document.getElementById('interest').value = '';
        document.getElementById('months').value = '';
        calculate();
    }

    function shareApp() {
        if (navigator.share) {
            navigator.share({ title: 'FC ESNA 2', url: window.location.href });
        } else {
            alert("تم نسخ الرابط: " + window.location.href);
        }
    }

    async function downloadImage() {
        const card = document.getElementById('calculatorCard');
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const canvas = await html2canvas(card, { backgroundColor: isDark ? '#020617' : '#f8fafc', scale: 2 });
        const link = document.createElement('a');
        link.download = `FC-Osama-${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }

    initTheme();
</script>
</body>
</html>
