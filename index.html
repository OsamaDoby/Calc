<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Smart Credit Study</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.95);
            --text-color: #f8fafc;
            --input-bg: #1e293b;
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --success: #22c55e;
            --glow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --input-bg: #f8fafc;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #cbd5e1;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--input-bg);
            padding: 5px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow);
        }

        .nav-btn {
            padding: 12px 25px;
            border: none;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .nav-btn.active {
            background: var(--primary-neon);
            color: #000;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 2.2rem;
            background: var(--card-bg);
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: var(--glow);
            position: relative;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .logo-area { text-align: center; color: var(--primary-neon); font-weight: 700; font-size: 1.6rem; margin-bottom: 1.5rem; text-shadow: var(--glow); }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--primary-neon); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        .study-results {
            background: rgba(0, 242, 255, 0.05);
            padding: 18px;
            border-radius: 20px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
        }

        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .result-row b { color: var(--primary-neon); }

        .status-badge {
            text-align: center;
            padding: 12px;
            border-radius: 15px;
            font-weight: bold;
            margin-top: 15px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
            text-transform: uppercase;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: #25d366;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 1000;
            color: white;
            text-decoration: none;
        }

        .footer { margin-top: 25px; font-size: 0.85rem; opacity: 0.8; }
        .footer a { color: var(--primary-neon); text-decoration: none; font-weight: bold; }
        
        .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="main-nav">
    <button class="nav-btn active" id="btn-calc" onclick="showTab('calc')">حاسبة القسط</button>
    <button class="nav-btn" id="btn-study" onclick="showTab('study')">الدراسة المقترحة</button>
</div>

<div class="container" id="captureArea">
    <div id="calc" class="tab-content active">
        <div class="logo-area">Finance Calc $</div>
        <div class="input-group">
            <label>مبلغ التمويل المطلوب</label>
            <input type="number" id="amount" placeholder="مثال: 20000" oninput="doLogic()">
        </div>
        <div class="input-group">
            <label>الفائدة السنوية (%)</label>
            <input type="number" id="interest" value="25" oninput="doLogic()">
        </div>
        <div class="input-group">
            <label>مدة التمويل (شهور)</label>
            <input type="number" id="months" value="12" oninput="doLogic()">
        </div>
        <div class="study-results">
            <div class="result-row"><span>القسط الشهري (مقرب):</span> <b id="resInstallment">0</b></div>
            <div class="result-row"><span>المصاريف الإدارية (5%):</span> <b id="resAdmin">0</b></div>
            <div class="result-row" style="margin-top:10px; border-top:1px solid var(--border-color); padding-top:10px;">
                <span>صافي المستلم النهائي:</span> <b id="resNet">0</b>
            </div>
        </div>
    </div>

    <div id="study" class="tab-content">
        <div class="logo-area">Credit Study 📄</div>
        <div class="input-group">
            <label>متوسط الدخل الشهري (مقترح)</label>
            <input type="number" id="income" oninput="updateStudyManually()">
            <span class="hint">* تم حسابه ليكون عبء الدين 40% تقريباً</span>
        </div>
        <div class="input-group">
            <label>إجمالي المصاريف والالتزامات</label>
            <input type="number" id="expenses" oninput="updateStudyManually()">
        </div>
        <div class="input-group">
            <label>إجمالي أصول المشروع (جرد بضاعة)</label>
            <input type="number" id="assets" oninput="updateStudyManually()">
        </div>
        
        <div class="study-results">
            <div class="result-row"><span>القسط من الدخل (عبء الدين):</span> <b id="resRatio">0%</b></div>
            <div class="result-row"><span>صافي الربح المتبقي:</span> <b id="resRemain">0</b></div>
            <div id="statusBox" class="status-badge">دراسة مطابقة للسيستم</div>
        </div>
    </div>

    <button class="action-btn" onclick="downloadImage()">تحميل التقرير الكامل</button>
</div>

<div class="footer">
    Developed by <a href="https://www.facebook.com/share/18TtS2GVNi/?mibextid=wwXIfr" target="_blank">Osama</a>
</div>

<a href="https://wa.me/message/FJEGUNCJ4JX7P1" class="whatsapp-float" target="_blank">
    <svg width="28" height="28" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.965L0 16l4.232-1.11a7.839 7.839 0 0 0 3.758.955h.001c4.438 0 8.044-3.606 8.048-8.046a7.848 7.848 0 0 0-2.438-5.473l-.001-.001ZM10.582 13.074c-1.023.36-2.148.165-3.18-.35l-.247-.122-2.51.659.67-2.44-.134-.213a6.71 6.71 0 0 1-1.03-3.51c0-3.712 3.023-6.735 6.737-6.735 1.8 0 3.49.7 4.76 1.97a6.69 6.69 0 0 1 1.97 4.76c0 3.712-3.024 6.736-6.74 6.736l-.003-.001Z"/></svg>
</a>

<script>
    let currentInstallment = 0;

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    }

    function doLogic() {
        // 1. حسابات الحاسبة
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const adminFee = amount * 0.05;
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        const rawPayment = months > 0 ? (amount + totalInterest) / months : 0;
        currentInstallment = Math.ceil(rawPayment / 5) * 5;
        
        const net = amount > 0 ? (amount - adminFee - currentInstallment) : 0;

        document.getElementById('resInstallment').innerText = currentInstallment.toLocaleString();
        document.getElementById('resAdmin').innerText = adminFee.toLocaleString();
        document.getElementById('resNet').innerText = Math.floor(net).toLocaleString();

        // 2. توليد الدراسة الائتمانية الوهمية الذكية
        if (amount > 0) {
            // الدخل المقترح يخلي القسط يمثل 40% (عشان يبقى مقبول سيستم)
            const suggestedIncome = Math.round((currentInstallment / 0.40) / 100) * 100;
            // المصاريف حوالي 15% من الدخل
            const suggestedExp = Math.round((suggestedIncome * 0.15) / 50) * 50;
            // الأصول (بضاعة) حوالي 1.8 مرة من مبلغ التمويل
            const suggestedAssets = Math.round((amount * 1.8) / 500) * 500;

            document.getElementById('income').value = suggestedIncome;
            document.getElementById('expenses').value = suggestedExp;
            document.getElementById('assets').value = suggestedAssets;

            updateStudyDisplay(suggestedIncome, suggestedExp);
        }
    }

    function updateStudyManually() {
        const inc = parseFloat(document.getElementById('income').value) || 0;
        const exp = parseFloat(document.getElementById('expenses').value) || 0;
        updateStudyDisplay(inc, exp);
    }

    function updateStudyDisplay(inc, exp) {
        const ratio = inc > 0 ? (currentInstallment / inc) * 100 : 0;
        const remain = inc - exp - currentInstallment;

        document.getElementById('resRatio').innerText = ratio.toFixed(1) + "%";
        document.getElementById('resRemain').innerText = Math.floor(remain).toLocaleString();
        
        const status = document.getElementById('statusBox');
        if (ratio > 0 && ratio <= 50) {
            status.innerText = "دراسة مطابقة (عبء دين مقبول)";
            status.style.color = "var(--success)";
            status.style.borderColor = "var(--success)";
        } else if (ratio > 50) {
            status.innerText = "تنبيه: عبء الدين مرتفع";
            status.style.color = "#fbbf24";
            status.style.borderColor = "#fbbf24";
        }
    }

    async function downloadImage() {
        const area = document.getElementById('captureArea');
        const canvas = await html2canvas(area, {
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
            scale: 2
        });
        const link = document.createElement('a');
        link.download = 'Finance-Full-Report.png';
        link.href = canvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
