<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC ESNA 2 - Pro Finance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.9);
            --text-color: #f8fafc;
            --input-bg: #1e293b;
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --glow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --input-bg: #f1f5f9;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #e2e8f0;
            --glow: 0 0 5px rgba(14, 165, 233, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 25px;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow);
            margin-bottom: 20px;
            position: relative;
        }

        .header-actions { display: flex; justify-content: space-between; margin-bottom: 1rem; }

        .btn-tool {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .logo-main {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-neon);
            letter-spacing: 1px;
            line-height: 1.1;
            text-shadow: var(--glow);
        }

        .logo-sub {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-color);
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .invoice-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 15px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .input-group { margin-bottom: 0.8rem; }
        label { display: block; margin-bottom: 4px; font-size: 0.8rem; opacity: 0.8; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 0.95rem;
        }
        input:focus { border-color: var(--primary-neon); box-shadow: var(--glow); }

        .results {
            margin-top: 1.2rem;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; align-items: center; }
        .result-item .val { color: var(--primary-neon); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .copy-icon { cursor: pointer; opacity: 0.5; font-size: 0.8rem; }
        .copy-icon:hover { opacity: 1; color: var(--primary-neon); }

        .highlight {
            border-top: 1px solid var(--border-color);
            margin-top: 10px;
            padding-top: 10px;
            color: var(--primary-neon);
            font-size: 1.1rem;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .btn-main {
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--primary-neon);
            background: transparent;
            color: var(--primary-neon);
        }

        .btn-main:hover { background: var(--primary-neon); color: #000; }
        .btn-whatsapp { border-color: #25d366; color: #25d366; }
        .btn-whatsapp:hover { background: #25d366; color: #fff; }

        .schedule-box {
            margin-top: 15px;
            font-size: 0.75rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }

        .footer { margin: 1.5rem 0; font-size: 0.8rem; opacity: 0.7; }
        .whatsapp-float {
            position: fixed; bottom: 20px; left: 20px;
            background: #25d366; width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 1000; color: white;
        }
    </style>
</head>
<body onload="setCurrentDate()">

<div class="container" id="calculatorCard">
    <div class="header-actions">
        <button class="btn-tool" onclick="toggleLang()" id="langBtn">English</button>
        <button class="btn-tool" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div class="logo-area">
        <div class="logo-main">FC ESNA 2</div>
        <div class="logo-sub">Finance Calculator</div>
    </div>

    <div class="invoice-info">
        <span id="invDate">التاريخ: --/--/----</span>
        <span id="invNo">رقم: #6622</span>
    </div>

    <div class="input-group">
        <label id="lblClient">اسم العميل</label>
        <input type="text" id="clientName" placeholder="اختياري..." oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblAmount">المبلغ الأساسي</label>
        <input type="number" id="amount" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblInterest">الفايدة (%)</label>
        <input type="number" id="interest" placeholder="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblMonths">المدة (بالشهور)</label>
        <input type="number" id="months" placeholder="0" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-item">
            <span id="resAdmin">المصاريف الإدارية (5%):</span>
            <span class="val" id="adminFee">0</span>
        </div>
        <div class="result-item">
            <span id="resInstallment">القسط الشهري:</span>
            <span class="val">
                <span id="monthlyPayment" style="color: var(--secondary-neon);">0</span>
                <span class="copy-icon" onclick="copyText('monthlyPayment')">📋</span>
            </span>
        </div>
        <div class="result-item highlight">
            <span id="resNetTotal">صافي المستلم النهائي:</span>
            <span class="val" id="netAmount">0</span>
        </div>
        
        <div class="schedule-box" id="scheduleArea">
            <b id="lblSched">تنبيه المواعيد:</b>
            <div id="firstInstallmentDate" style="opacity:0.8; margin-top:5px;">ادخل البيانات لعرض المواعيد...</div>
        </div>
    </div>

    <div class="action-btns">
        <button class="btn-main" onclick="downloadImage()">
            <span id="btnSave">تحميل الصورة</span>
        </button>
        <button class="btn-main btn-whatsapp" onclick="sendWhatsApp()">
            <span>واتساب</span>
        </button>
    </div>
</div>

<div class="footer">
    Designed by <a href="https://www.facebook.com/share/18TtS2GVNi/?mibextid=wwXIfr" target="_blank">Osama</a>
</div>

<script>
    const translations = {
        ar: {
            lblClient: "اسم العميل", lblAmount: "المبلغ الأساسي", lblInterest: "الفايدة (%)", lblMonths: "المدة (بالشهور)",
            resAdmin: "المصاريف الإدارية (5%):", resInstallment: "القسط الشهري:",
            resNetTotal: "صافي المستلم النهائي:", btnSave: "تحميل الصورة", langBtn: "English",
            lblSched: "تنبيه المواعيد:"
        },
        en: {
            lblClient: "Client Name", lblAmount: "Principal Amount", lblInterest: "Interest (%)", lblMonths: "Months",
            resAdmin: "Admin Fees (5%):", resInstallment: "Monthly Payment:",
            resNetTotal: "Final Net Disbursed:", btnSave: "Download Image", langBtn: "عربي",
            lblSched: "Due Dates Hint:"
        }
    };

    let currentLang = 'ar';

    function setCurrentDate() {
        const today = new Date();
        const dateStr = today.toLocaleDateString('ar-EG');
        document.getElementById('invDate').innerText = `التاريخ: ${dateStr}`;
    }

    function toggleTheme() {
        const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeBtn').innerText = theme === 'light' ? '☀️' : '🌙';
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.className = currentLang === 'en' ? 'en' : '';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        for (let key in translations[currentLang]) {
            const el = document.getElementById(key);
            if (el) el.innerText = translations[currentLang][key];
        }
        calculate();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const adminFee = amount * 0.05;
        const netAfterAdmin = amount - adminFee;
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        const rawMonthlyPayment = months > 0 ? (amount + totalInterest) / months : 0;
        const roundedMonthlyPayment = Math.ceil(rawMonthlyPayment / 5) * 5;
        const netAmount = amount > 0 ? (netAfterAdmin - roundedMonthlyPayment) : 0;

        document.getElementById('adminFee').innerText = adminFee.toLocaleString();
        document.getElementById('monthlyPayment').innerText = roundedMonthlyPayment.toLocaleString();
        document.getElementById('netAmount').innerText = (netAmount > 0 ? Math.floor(netAmount) : 0).toLocaleString();

        // تحديث جدول المواعيد
        if(months > 0) {
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            const dateOptions = { month: 'long', day: 'numeric' };
            document.getElementById('firstInstallmentDate').innerText = 
                currentLang === 'ar' ? `استحقاق أول قسط: ${nextMonth.toLocaleDateString('ar-EG', dateOptions)}` 
                : `First Installment: ${nextMonth.toLocaleDateString('en-US', dateOptions)}`;
        }
    }

    function copyText(id) {
        const val = document.getElementById(id).innerText;
        navigator.clipboard.writeText(val);
        alert(currentLang === 'ar' ? "تم النسخ!" : "Copied!");
    }

    function sendWhatsApp() {
        const name = document.getElementById('clientName').value || "عميلنا العزيز";
        const amount = document.getElementById('amount').value;
        const installment = document.getElementById('monthlyPayment').innerText;
        const months = document.getElementById('months').value;
        
        const text = `مرحباً ${name},\nتفاصيل الحسبة من FC ESNA 2:\n- المبلغ: ${amount} ج.م\n- القسط الشهري: ${installment} ج.م\n- لمدة: ${months} شهر\nشكراً لتعاملكم معنا!`;
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    async function downloadImage() {
        const card = document.getElementById('calculatorCard');
        const canvas = await html2canvas(card, {
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
            scale: 2
        });
        const link = document.createElement('a');
        link.download = `Invoice-${document.getElementById('clientName').value || 'Client'}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
