<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Dark Mode (Default) */
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-color: #f8fafc;
            --input-bg: #1e293b;
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(255, 255, 255, 0.1);
            --label-color: #94a3b8;
        }

        [data-theme="light"] {
            /* Light Mode Enhanced */
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --input-bg: #f8fafc;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #e2e8f0;
            --label-color: #64748b;
        }

        * {
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 450px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle, .lang-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: var(--label-color);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1);
        }

        .results {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px dashed var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.7rem;
            font-size: 0.9rem;
        }

        .result-item.highlight {
            background: rgba(0, 242, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 5px;
        }

        .result-item span:last-child {
            color: var(--primary-neon);
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--label-color);
        }

        .footer strong {
            color: var(--secondary-neon);
        }

        body.en { direction: ltr; font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div class="logo-area">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--primary-neon)">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span id="titleText">Finance Calculator</span>
    </div>

    <div class="input-group" style="margin-top: 1.5rem;">
        <label id="lblAmount">المبلغ الأساسي</label>
        <input type="number" id="amount" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblInterest">الفايدة (%)</label>
        <input type="number" id="interest" placeholder="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblMonths">المدة (بالشهور)</label>
        <input type="number" id="months" placeholder="0" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-item">
            <span id="resAdmin">المصاريف الإدارية:</span>
            <span id="adminFee">0</span>
        </div>
        <div class="result-item">
            <span id="resNetAdmin">الصافي بعد المصاريف:</span>
            <span id="netAfterAdmin">0</span>
        </div>
        <div class="result-item">
            <span id="resInterest">الفايدة الموزعة:</span>
            <span id="totalInterest">0</span>
        </div>
        <div class="result-item">
            <span id="resInstallment">القسط الشهري:</span>
            <span id="monthlyPayment">0</span>
        </div>
        <div class="result-item highlight">
            <span id="resNetTotal">صافي المبلغ المستلم النهائي:</span>
            <span id="netAmount">0</span>
        </div>
    </div>

    <div class="footer" id="footerText">
        Designed & Developed by <strong>Osama</strong>
    </div>
</div>

<script>
    const translations = {
        ar: {
            titleText: "Finance Calculator",
            lblAmount: "المبلغ الأساسي",
            lblInterest: "الفايدة (%)",
            lblMonths: "المدة (بالشهور)",
            resAdmin: "المصاريف الإدارية:",
            resNetAdmin: "الصافي بعد المصاريف:",
            resInterest: "الفايدة الموزعة:",
            resInstallment: "القسط الشهري:",
            resNetTotal: "صافي المستلم (بعد المصاريف والقسط):",
            langBtn: "English",
            footer: "مصمم ومطور بواسطة <strong>Osama</strong>"
        },
        en: {
            titleText: "Finance Calculator",
            lblAmount: "Principal Amount",
            lblInterest: "Interest Rate (%)",
            lblMonths: "Duration (Months)",
            resAdmin: "Admin Fees:",
            resNetAdmin: "Net after Admin Fees:",
            resInterest: "Total Interest:",
            resInstallment: "Monthly Installment:",
            resNetTotal: "Final Net Disbursed:",
            langBtn: "عربي",
            footer: "Designed & Developed by <strong>Osama</strong>"
        }
    };

    let currentLang = 'ar';

    // التبديل التلقائي حسب الثيم المفضل للنظام
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeBtn').innerText = '☀️';
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').innerText = '🌙';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('themeBtn').innerText = '☀️';
        }
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.className = currentLang === 'en' ? 'en' : '';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        
        for (let key in translations[currentLang]) {
            const el = document.getElementById(key);
            if (el) el.innerHTML = translations[currentLang][key];
        }
        calculate();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const adminFee = amount * 0.05;
        const netAfterAdmin = amount - adminFee;
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        const monthlyPayment = months > 0 ? (amount + totalInterest) / months : 0;
        const netAmount = amount > 0 ? (netAfterAdmin - monthlyPayment) : 0;

        document.getElementById('adminFee').innerText = adminFee.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('netAfterAdmin').innerText = netAfterAdmin.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('totalInterest').innerText = totalInterest.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('monthlyPayment').innerText = monthlyPayment.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('netAmount').innerText = (netAmount > 0 ? netAmount : 0).toLocaleString(undefined, {minimumFractionDigits: 2});
    }
</script>

</body>
</html>
