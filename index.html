<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC ESNA 2 - Finance Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.85);
            --text-color: #f8fafc;
            --input-bg: rgba(30, 41, 59, 0.7);
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(0, 242, 255, 0.2);
            --glow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1e293b;
            --input-bg: #f1f5f9;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #e2e8f0;
            --glow: 0 0 10px rgba(14, 165, 233, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 25px;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow);
            margin-bottom: 20px;
        }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }

        .btn-tool {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .btn-reset:hover { background: #ef4444; color: white; }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .logo-main {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-neon);
            text-shadow: var(--glow);
        }

        .logo-sub {
            font-size: 0.75rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; opacity: 0.8; font-weight: 600; }
        
        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }
        input:focus { border-color: var(--primary-neon); box-shadow: var(--glow); }

        .results {
            margin-top: 1.5rem;
            padding: 15px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
        .result-item span:last-child { color: var(--primary-neon); font-weight: bold; }
        
        .result-item.highlight {
            border-top: 1px solid var(--border-color);
            margin-top: 10px;
            padding-top: 10px;
            font-size: 1rem;
        }

        .save-btn {
            width: 100%;
            background: transparent;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            padding: 14px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .save-btn:hover { background: var(--primary-neon); color: #000; box-shadow: var(--glow); }

        .info-box {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            background: var(--card-bg);
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .footer-social {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .icon-fb { background: #1877F2; }
        .icon-wa { background: #25d366; }
        
        /* تناسق الأيقونات مع مود الموقع */
        [data-theme="light"] .social-icon { border-color: rgba(0,0,0,0.1); }

    </style>
</head>
<body>

<div class="container" id="calculatorCard">
    <div class="header-actions">
        <div>
            <button class="btn-tool" onclick="toggleLang()" id="langBtn" style="display:inline-block">EN</button>
            <button class="btn-tool" onclick="toggleTheme()" id="themeBtn" style="display:inline-block">🌙</button>
        </div>
        <button class="btn-tool btn-reset" onclick="resetAll()">
            <span id="btnResetText">مسح البيانات</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
    </div>

    <div class="logo-area">
        <div class="logo-main">FC ESNA 2</div>
        <div class="logo-sub" id="logoSub">Finance Calculator</div>
    </div>

    <div class="input-group">
        <label id="lblAmount">المبلغ الأساسي</label>
        <input type="number" id="amount" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-row">
        <div class="input-group">
            <label id="lblAdminRate">نسبة المصاريف (%)</label>
            <input type="number" id="adminRate" value="5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label id="lblInterest">الفايدة (%)</label>
            <input type="number" id="interest" placeholder="0" oninput="calculate()">
        </div>
    </div>

    <div class="input-group">
        <label id="lblMonths">المدة (بالشهور)</label>
        <input type="number" id="months" placeholder="0" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-item">
            <span id="resAdmin">المصاريف الإدارية:</span>
            <span id="adminFee">0</span>
        </div>
        <div class="result-item">
            <span id="resNetAdmin">الصافي بعد المصاريف:</span>
            <span id="netAfterAdmin">0</span>
        </div>
        <div class="result-item">
            <span id="resInstallment">القسط الشهري (مقرب):</span>
            <span id="monthlyPayment" style="color: var(--secondary-neon);">0</span>
        </div>
        <div class="result-item highlight">
            <span id="resNetTotal">صافي المستلم النهائي:</span>
            <span id="netAmount">0</span>
        </div>
    </div>

    <button class="save-btn" onclick="downloadImage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span id="btnSave">تصدير بيانات العملية</span>
    </button>
</div>

<div class="footer-social">
    <a href="https://www.facebook.com/share/18TtS2GVNi/?mibextid=wwXIfr" class="social-icon icon-fb" target="_blank">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    </a>
    <a href="https://wa.me/message/FJEGUNCJ4JX7P1" class="social-icon icon-wa" target="_blank">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.965L0 16l4.232-1.11a7.839 7.839 0 0 0 3.758.955h.001c4.438 0 8.044-3.606 8.048-8.046a7.848 7.848 0 0 0-2.438-5.473l-.001-.001ZM10.582 13.074c-1.023.36-2.148.165-3.18-.35l-.247-.122-2.51.659.67-2.44-.134-.213a6.71 6.71 0 0 1-1.03-3.51c0-3.712 3.023-6.735 6.737-6.735 1.8 0 3.49.7 4.76 1.97a6.69 6.69 0 0 1 1.97 4.76c0 3.712-3.024 6.736-6.74 6.736l-.003-.001Z"/></svg>
    </a>
</div>

<script>
    const translations = {
        ar: {
            lblAmount: "المبلغ الأساسي", lblAdminRate: "نسبة المصاريف (%)", lblInterest: "الفايدة (%)", 
            lblMonths: "المدة (بالشهور)", resAdmin: "المصاريف الإدارية:", resNetAdmin: "الصافي بعد المصاريف:",
            resInstallment: "القسط الشهري (مقرب):", resNetTotal: "صافي المستلم النهائي:", 
            btnSave: "تصدير بيانات العملية", btnResetText: "مسح البيانات", logoSub: "Finance Calculator"
        },
        en: {
            lblAmount: "Principal Amount", lblAdminRate: "Admin Rate (%)", lblInterest: "Interest (%)", 
            lblMonths: "Months", resAdmin: "Admin Fees:", resNetAdmin: "Net After Fees:",
            resInstallment: "Monthly (Rounded):", resNetTotal: "Final Net:", 
            btnSave: "Export Process Data", btnResetText: "Reset", logoSub: "Finance Calculator"
        }
    };

    let currentLang = 'ar';

    function initTheme() {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = prefersDark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeBtn').innerText = theme === 'light' ? '☀️' : '🌙';
    }
    initTheme();

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        document.getElementById('themeBtn').innerText = newTheme === 'light' ? '☀️' : '🌙';
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
        for (let key in translations[currentLang]) {
            const el = document.getElementById(key);
            if (el) el.innerHTML = translations[currentLang][key];
        }
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const adminRate = parseFloat(document.getElementById('adminRate').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        const adminFee = amount * (adminRate / 100);
        const netAfterAdmin = amount - adminFee;
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        const rawMonthlyPayment = months > 0 ? (amount + totalInterest) / months : 0;
        const roundedMonthlyPayment = Math.ceil(rawMonthlyPayment / 5) * 5;
        const netAmount = amount > 0 ? (netAfterAdmin - roundedMonthlyPayment) : 0;

        document.getElementById('adminFee').innerText = adminFee.toLocaleString();
        document.getElementById('netAfterAdmin').innerText = netAfterAdmin.toLocaleString();
        document.getElementById('monthlyPayment').innerText = roundedMonthlyPayment.toLocaleString();
        document.getElementById('netAmount').innerText = (netAmount > 0 ? Math.floor(netAmount) : 0).toLocaleString();
    }

    function resetAll() {
        document.getElementById('amount').value = '';
        document.getElementById('interest').value = '';
        document.getElementById('months').value = '';
        document.getElementById('adminRate').value = '5';
        calculate();
    }

    async function downloadImage() {
        const card = document.getElementById('calculatorCard');
        const canvas = await html2canvas(card, {
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
            scale: 2
        });
        const link = document.createElement('a');
        link.download = `FC-Export-${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
