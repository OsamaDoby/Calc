<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.8);
            --text-color: #f8fafc;
            --input-bg: #1e293b;
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --border-color: rgba(0, 242, 255, 0.3);
            --glow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --input-bg: #f8fafc;
            --primary-neon: #0ea5e9;
            --secondary-neon: #6366f1;
            --border-color: #cbd5e1;
            --glow: 0 0 10px rgba(14, 165, 233, 0.2);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Neon Orbs in Background */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.5;
        }
        body::before { background: var(--primary-neon); top: -100px; left: -100px; }
        body::after { background: var(--secondary-neon); bottom: -100px; right: -100px; }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            background: var(--card-bg);
            border-radius: 30px;
            border: 2px solid var(--border-color);
            box-shadow: var(--glow), 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        .header-actions { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }

        .btn-tool {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: var(--glow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-neon);
            text-shadow: var(--glow);
            margin-bottom: 2rem;
        }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
        }
        input:focus { border-color: var(--primary-neon); box-shadow: var(--glow); }

        .results {
            margin-top: 2rem;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .result-item span:last-child { color: var(--primary-neon); font-weight: 700; text-shadow: var(--glow); }
        
        .result-item.highlight {
            border-top: 2px solid var(--border-color);
            margin-top: 15px;
            padding-top: 15px;
            font-size: 1.1rem;
        }

        .share-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .footer { text-align: center; margin-top: 2rem; font-size: 0.9rem; }
        .footer a { color: var(--primary-neon); text-decoration: none; font-weight: bold; text-shadow: var(--glow); }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25d366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
            z-index: 100;
            color: white;
        }

        body.en { direction: ltr; }
    </style>
</head>
<body>

<div class="container" id="calculatorCard">
    <div class="header-actions">
        <button class="btn-tool" onclick="toggleLang()" id="langBtn">English</button>
        <button class="btn-tool" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div class="logo-area">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span id="titleText">Finance Calculator</span>
    </div>

    <div class="input-group">
        <label id="lblAmount">المبلغ الأساسي</label>
        <input type="number" id="amount" placeholder="0.00" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblInterest">الفايدة (%)</label>
        <input type="number" id="interest" placeholder="0" oninput="calculate()">
    </div>

    <div class="input-group">
        <label id="lblMonths">المدة (بالشهور)</label>
        <input type="number" id="months" placeholder="0" oninput="calculate()">
    </div>

    <div class="results">
        <div class="result-item">
            <span id="resAdmin">المصاريف الإدارية:</span>
            <span id="adminFee">0</span>
        </div>
        <div class="result-item">
            <span id="resNetAdmin">الصافي بعد المصاريف:</span>
            <span id="netAfterAdmin">0</span>
        </div>
        <div class="result-item">
            <span id="resInterest">الفايدة الموزعة:</span>
            <span id="totalInterest">0</span>
        </div>
        <div class="result-item" style="color: var(--secondary-neon);">
            <span id="resInstallment">القسط الشهري (مقرب):</span>
            <span id="monthlyPayment">0</span>
        </div>
        <div class="result-item highlight">
            <span id="resNetTotal">صافي المستلم النهائي:</span>
            <span id="netAmount">0</span>
        </div>
    </div>

    <button class="share-btn" onclick="downloadImage()">
        <span id="btnSave">حفظ كصورة للعميل</span>
    </button>

    <div class="footer" id="footerText">
        Designed & Developed by <a href="https://www.facebook.com/share/18TtS2GVNi/?mibextid=wwXIfr" target="_blank">Osama</a>
    </div>
</div>

<a href="https://wa.me/message/FJEGUNCJ4JX7P1" class="whatsapp-float" target="_blank">
    <svg width="32" height="32" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.06 3.965L0 16l4.232-1.11a7.839 7.839 0 0 0 3.758.955h.001c4.438 0 8.044-3.606 8.048-8.046a7.848 7.848 0 0 0-2.438-5.473l-.001-.001ZM10.582 13.074c-1.023.36-2.148.165-3.18-.35l-.247-.122-2.51.659.67-2.44-.134-.213a6.71 6.71 0 0 1-1.03-3.51c0-3.712 3.023-6.735 6.737-6.735 1.8 0 3.49.7 4.76 1.97a6.69 6.69 0 0 1 1.97 4.76c0 3.712-3.024 6.736-6.74 6.736l-.003-.001Z"/></svg>
</a>

<script>
    const translations = {
        ar: {
            titleText: "Finance Calculator",
            lblAmount: "المبلغ الأساسي", lblInterest: "الفايدة (%)", lblMonths: "المدة (بالشهور)",
            resAdmin: "المصاريف الإدارية:", resNetAdmin: "الصافي بعد المصاريف:",
            resInterest: "الفايدة الموزعة:", resInstallment: "القسط الشهري (مقرب):",
            resNetTotal: "صافي المستلم النهائي:", btnSave: "حفظ كصورة للعميل", langBtn: "English"
        },
        en: {
            titleText: "Finance Calculator",
            lblAmount: "Principal Amount", lblInterest: "Interest Rate (%)", lblMonths: "Duration (Months)",
            resAdmin: "Admin Fees:", resNetAdmin: "Net after Admin Fees:",
            resInterest: "Total Interest:", resInstallment: "Monthly Payment (Rounded):",
            resNetTotal: "Final Net Disbursed:", btnSave: "Save for Client", langBtn: "عربي"
        }
    };

    let currentLang = 'ar';

    function toggleTheme() {
        const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeBtn').innerText = theme === 'light' ? '☀️' : '🌙';
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.className = currentLang === 'en' ? 'en' : '';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        for (let key in translations[currentLang]) {
            const el = document.getElementById(key);
            if (el && key !== 'footer') el.innerText = translations[currentLang][key];
        }
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const interestRate = parseFloat(document.getElementById('interest').value) || 0;
        const months = parseInt(document.getElementById('months').value) || 0;

        // 1. المصاريف الإدارية
        const adminFee = amount * 0.05;
        const netAfterAdmin = amount - adminFee;

        // 2. الفائدة والقسط
        const totalInterest = amount * (interestRate / 100) * (months / 12);
        let rawMonthlyPayment = months > 0 ? (amount + totalInterest) / months : 0;
        
        // --- ميزة التقريب لأقرب 5 جنيه جَبراً ---
        // مثال: 1083.33 تصبح 1085
        const roundedMonthlyPayment = Math.ceil(rawMonthlyPayment / 5) * 5;

        // 3. الصافي النهائي (بعد خصم المصاريف وأول قسط مقرب)
        const netAmount = amount > 0 ? (netAfterAdmin - roundedMonthlyPayment) : 0;

        document.getElementById('adminFee').innerText = adminFee.toLocaleString();
        document.getElementById('netAfterAdmin').innerText = netAfterAdmin.toLocaleString();
        document.getElementById('totalInterest').innerText = totalInterest.toLocaleString();
        document.getElementById('monthlyPayment').innerText = roundedMonthlyPayment.toLocaleString();
        document.getElementById('netAmount').innerText = (netAmount > 0 ? Math.floor(netAmount) : 0).toLocaleString();
    }

    async function downloadImage() {
        const card = document.getElementById('calculatorCard');
        const canvas = await html2canvas(card, {
            backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
            scale: 2
        });
        const link = document.createElement('a');
        link.download = 'Finance-Quote.png';
        link.href = canvas.toDataURL();
        link.click();
    }
</script>
</body>
</html>
